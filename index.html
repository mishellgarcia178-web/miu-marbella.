/* Identidad original de Marbella: panel editorial, degradados carmesí y organización por prioridad */
body{background:radial-gradient(circle at 100% 5%,#ffe3e6 0,transparent 36%),#fff8f8}
.sidebar{width:244px;background:linear-gradient(158deg,#570914 0%,#8f1126 42%,#d23b48 100%);padding-top:30px}
.brand{font-size:38px;letter-spacing:-2.5px}
.faculty{font-size:12px;line-height:1.45;max-width:190px;color:#ffe3e7}
.side-nav{gap:6px}.navbtn{border-radius:12px}.navbtn.active{background:#fff;color:#8f1126;font-weight:800;box-shadow:0 7px 18px #28060a30}.navbtn:hover:not(.active){background:#ffffff30}
.topbar{background:#fffcfc;box-shadow:0 2px 15px #700c1510}
.card{border-radius:18px;box-shadow:0 12px 36px #75111a0b}

.course-card:nth-child(even){border-top-color:#ef7881}
.course-grid{grid-template-columns:repeat(auto-fit,minmax(245px,1fr))}
.btn{background:linear-gradient(115deg,#8f1126,#d83e50);box-shadow:0 6px 16px #ae253228}

.btn.outline-light{background:transparent;border:1px solid #ffced5;box-shadow:none}
.welcome-panel{padding:38px 38px 36px;border-radius:24px;background:linear-gradient(116deg,#5d0a1a 0%,#9d1730 44%,#d43a4c 80%,#f07e87 100%);color:white;position:relative;overflow:hidden;box-shadow:0 18px 34px #8c19253a}

.welcome-panel h1{font-size:36px;letter-spacing:-1.7px;margin:12px 0}.welcome-panel p{font-size:15px;opacity:.92;max-width:490px}.welcome-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.welcome-panel .btn{position:relative;z-index:1}.welcome-deco{position:absolute;right:28px;bottom:18px;opacity:.5;font-size:11px;letter-spacing:2px}
.overview-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin:18px 0 26px}.mini-stat{background:#fff;border:1px solid #f1dbe0;border-radius:17px;padding:19px 22px;display:flex;flex-direction:column;gap:7px;box-shadow:0 7px 20px #7413210a}.mini-stat span{font-size:10px;font-weight:850;letter-spacing:1.4px;color:#aa4f5c}.mini-stat strong{font-size:31px;color:#8f1126}.mini-stat small{color:#786267}
.focus-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(270px,1fr);gap:18px}.focus-main{background:white;border:1px solid #efdce0;border-radius:18px;padding:23px}.focus-side{display:flex;flex-direction:column;gap:18px}.panel-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:15px}.panel-heading h2{margin:5px 0 0}.panel-heading.second{margin:25px 0 11px}
.spotlight{background:linear-gradient(135deg,#fff2f4,#ffe2e6);border:1px solid #edbcc4;border-radius:16px;padding:23px}.spotlight h2{font-size:21px;max-width:390px;margin:9px 0}.spotlight p{color:#80515b}.spotlight-label{background:#901327;color:white;border-radius:30px;padding:5px 10px;font-size:10px;font-weight:800;letter-spacing:1px}
.priority-line,.notice-line{width:100%;display:flex;text-align:left;align-items:center;gap:12px;border:0;border-bottom:1px solid #f2e3e6;background:transparent;padding:13px 2px}.priority-line:hover,.notice-line:hover{background:#fff8f9}.priority-line span:nth-child(2),.notice-line span:last-child{flex:1;min-width:0}.priority-line strong,.notice-line strong{display:block;font-size:12px;color:#3e2b30}.priority-line small,.notice-line small{display:block;color:#987680;margin-top:5px}.priority-line em{font-size:11px;color:#a04f5a;white-space:nowrap;font-style:normal}.priority-dot{height:10px;width:10px;border-radius:50%;flex:none;background:#67a17d}.priority-dot.today{background:#e4af3d}.priority-dot.late{background:#c72d45}.below-actions{margin-top:20px}.next-class{background:linear-gradient(145deg,#fff,#fff1f3)}.next-class-title{font-size:17px;font-weight:800;color:#861326;padding:10px 0 2px}.next-class p{line-height:1.8}.notice-panel .panel-heading h2{margin:0}.notice-indicator{flex:none;width:9px;height:9px;border-radius:50%;background:#f2a85e}.notice-indicator.important{background:#c6213e}

@media(max-width:700px){.welcome-panel{padding:28px 22px}.welcome-panel h1{font-size:28px}.overview-stats{grid-template-columns:1fr;gap:9px}.focus-side,.alert-grid{grid-template-columns:1fr}.alerts-summary{flex-direction:column;align-items:flex-start}.sidebar{width:244px}.content{padding:18px}.welcome-deco{display:none}}

/* Portada exclusiva: composición editorial con panel flotante y vista previa */
body:has(.entry-shell){background:#fff8f7}
.entry-shell{min-height:calc(100vh - 34px);position:relative;overflow:hidden;background:radial-gradient(ellipse at 80% 20%,#ffd8da 0%,transparent 40%),radial-gradient(ellipse at 10% 90%,#fce0df 0%,transparent 42%),#fff9f8;padding:24px clamp(18px,5vw,80px) 48px}
.entry-top{max-width:1230px;margin:0 auto 38px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.entry-logo{font-size:37px;font-weight:850;letter-spacing:-2.8px;color:#831225;line-height:1}
.entry-logo span{color:#e14c59}
.entry-degree{font-size:11px;font-weight:650;letter-spacing:.2px;color:#8c5260;margin-top:8px}
.entry-pill{border:1px solid #ebc6cc;color:#8c2333;background:#fff7f7;border-radius:99px;padding:10px 14px;font-size:11px;font-weight:750;letter-spacing:1px;text-transform:uppercase}
.entry-grid{max-width:1230px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:clamp(22px,5vw,75px);align-items:center}

.entry-story h1{font-size:clamp(48px,5.4vw,78px);letter-spacing:-4px;line-height:1.045;margin:20px 0;color:#42131d;font-weight:850;max-width:650px}

.entry-story>p{color:#74565c;max-width:480px;font-size:16px;line-height:1.7;margin-bottom:30px}
.entry-preview{background:linear-gradient(132deg,#721020 0%,#a41d33 48%,#ed6a6c 100%);border-radius:23px;padding:23px 24px 25px;color:#fff;position:relative;box-shadow:0 19px 35px #7d1c2a35;max-width:550px;overflow:hidden}

.entry-preview h2{font-size:20px;margin:15px 0 5px;letter-spacing:-.5px;color:white}
.entry-preview>p{font-size:12px;color:#ffe5e6;margin:0 0 16px}

.entry-form{background:#fff;box-shadow:0 30px 80px #6a172322;border:1px solid #f1dfe1;border-radius:29px;padding:clamp(25px,4vw,46px);position:relative;overflow:hidden}

.entry-form .form-mini{color:#b33d4e;text-transform:uppercase;font-size:10px;letter-spacing:2px;font-weight:850}
.entry-form h2{font-size:31px;line-height:1.12;letter-spacing:-1.4px;margin:16px 0 12px;color:#36141b}
.entry-form p{line-height:1.55;color:#81636a}.entry-form .field-label{margin-top:22px;color:#603c45}.entry-form .field{min-height:49px;background:#fffaf9;border:1px solid #e8ced2}.entry-form .btn.entry-cta{min-height:51px;margin:16px 0 8px;width:100%;font-size:14px;border-radius:12px}.entry-form .btn.entry-alt{min-height:45px;margin:0;width:100%;border-radius:12px}.entry-privacy{display:flex;gap:9px;color:#96787e;font-size:11px;line-height:1.5;border-top:1px solid #f4e7e9;margin-top:22px;padding-top:18px}
.entry-foot{max-width:1230px;margin:33px auto 0;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;color:#97747e;font-size:11px}
@media(max-width:820px){.entry-grid{grid-template-columns:1fr;max-width:580px}.entry-top,.entry-foot{max-width:580px}.entry-story h1{font-size:clamp(43px,9vw,62px);letter-spacing:-2.8px}.entry-top{margin-bottom:8px}.entry-story{padding:15px 0 0}}
@media(max-width:440px){.entry-shell{padding:18px 15px 30px}.entry-form{padding:26px 20px}.entry-preview{padding:20px}.entry-story h1{font-size:43px}.entry-pill{font-size:9px;padding:8px}.entry-quick>div{padding:11px 7px}}

/* Portada: fondo rojo degradado de extremo a extremo, sin bloque de vista rápida */

 let urgent=due.filter(t=>rel(t.due)<=2), unread=state.announcements.filter(a=>!a.read), top=due[0];

 return `<div class="welcome-panel"><div class="eyebrow" style="color:#ffced6">MI ESPACIO ACADÉMICO · CONTADURÍA</div><h1>¡Hola, ${escapeHTML(state.name.split(' ')[0])}!</h1><p>Organizá tus entregas, prepará tu semana y enterate de los cambios importantes.</p><div class="welcome-actions"><button class="btn light" onclick="nav('tasks')">Revisar entregas →</button><button class="btn outline-light" onclick="nav('schedule')">Ver mi agenda</button></div><span class="welcome-deco">01 / MIU</span></div>
 <div class="overview-stats"><div class="mini-stat"><span>ENTREGAS PENDIENTES</span><strong>${due.length}</strong><small>Actividades por completar</small></div><div class="mini-stat"><span>PRIORIDAD ALTA</span><strong>${urgent.length}</strong><small>Vencidas o en 48 horas</small></div><div class="mini-stat"><span>AVISOS POR LEER</span><strong>${unread.length}</strong><small>Actualizaciones de tus cursos</small></div></div>
 <div class="focus-grid"><div class="focus-main"><div class="panel-heading"><div><span class="eyebrow">TU SIGUIENTE PASO</span><h2>Lo primero en tu lista</h2></div><button class="link-btn" onclick="nav('tasks')">Todas mis entregas →</button></div>${top?`<div class="spotlight"><span class="spotlight-label">${rel(top.due)<0?'REQUIERE ATENCIÓN':rel(top.due)===0?'PARA HOY':'PRÓXIMA ENTREGA'}</span><h2>${escapeHTML(top.title)}</h2><p>${escapeHTML(cn(top.course))} · ${formatDate(top.due)} · ${top.weight}% de la nota</p><button class="btn" onclick="openSubmit(${top.id})">Abrir actividad →</button></div>`:'<div class="empty">¡Estás al día con tus entregas!</div>'}<div class="panel-heading second"><h2>Después de eso</h2></div>${due.slice(1,4).map(t=>`<button class="priority-line" onclick="openSubmit(${t.id})"><span class="priority-dot ${status(t)}"></span><span><strong>${escapeHTML(t.title)}</strong><small>${escapeHTML(cn(t.course))}</small></span><em>${formatDate(t.due)}</em></button>`).join('')||'<p class="muted">No hay más tareas próximas.</p>'}<div class="below-actions"><button class="btn soft" onclick="openNewTask()">+ Agregar recordatorio</button></div></div>
 <div class="focus-side"><div class="card next-class"><div class="eyebrow">AGENDA ACADÉMICA</div><h2>Clases de la semana</h2><div class="next-class-title">${escapeHTML(next.name)}</div><p class="small muted">${escapeHTML(next.days.join(' y '))}<br>${escapeHTML(next.time)} · Aula ${escapeHTML(next.room)}</p><button class="link-btn" onclick="nav('schedule')">Abrir agenda completa →</button></div><div class="card notice-panel"><div class="panel-heading"><h2>Centro de avisos</h2><button class="link-btn" onclick="nav('announcements')">Ver todos →</button></div>${unread.slice(0,3).map(a=>`<button class="notice-line" onclick="showAnnouncement(${a.id})"><span class="notice-indicator ${a.important?'important':''}"></span><span><strong>${escapeHTML(a.title)}</strong><small>${escapeHTML(cn(a.course))}</small></span></button>`).join('')||'<p class="muted small">No tenés avisos sin leer.</p>'}</div></div></div>`
}
function dismissGuide(){state.guideSeen=true;save();render()}
function tasksPage(){let arr=[...state.tasks];if(filter==='Por entregar')arr=arr.filter(t=>t.status!=='entregada');if(filter==='Entregadas')arr=arr.filter(t=>t.status==='entregada');if(filter==='Tardías')arr=arr.filter(t=>status(t)==='late');arr.sort((a,b)=>sort==='peso'?(b.weight-a.weight):sort==='fecha'?b.due.localeCompare(a.due):a.due.localeCompare(b.due));return `${pageTitle('PLANIFICACIÓN','Plan de entregas','Ordená los trabajos de Auditoría y Contaduría según su fecha y prioridad.') }<div class="card"><div class="between"><div class="flex"><button class="btn" onclick="openNewTask()">+ Nueva tarea</button><button class="btn secondary" onclick="exportData()">↓ Descargar copia de tareas</button></div><label class="small muted">Ordenar <select class="field" onchange="setSort(this.value)"><option value="urgencia" ${sort==='urgencia'?'selected':''}>Urgencia</option><option value="fecha" ${sort==='fecha'?'selected':''}>Fecha reciente</option><option value="peso" ${sort==='peso'?'selected':''}>Peso en nota</option></select></label></div><div class="tabs">${['Todos','Por entregar','Entregadas','Tardías'].map(x=>`<button class="tab ${filter===x?'active':''}" onclick="setFilter('${x}')">${x}</button>`).join('')}</div>${legend()}${arr.length?arr.map(taskHTML).join(''):'<div class="empty">No hay actividades en esta categoría.</div>'}<p class="small muted">Las entregas tardías siguen disponibles en esta demostración y se identifican como tardías.</p></div>`}
function setFilter(s){filter=s;render()}function setSort(s){sort=s;render()}
function openNewTask(){showModal(`<h2 style="margin:0">Nueva tarea personal</h2><p class="muted">Creá una actividad ficticia para probar el funcionamiento.</p><form id="newtask" onsubmit="createTask(event)"><label class="field-label">Nombre de la tarea</label><input class="field full" name="title" maxlength="100" required placeholder="Ej. Leer capítulo 4"><label class="field-label">Curso</label><select class="field full" name="course">${courses.map(c=>`<option value="${c.id}">${escapeHTML(c.name)}</option>`).join('')}</select><label class="field-label">Fecha de entrega</label><input class="field full" name="due" type="date" value="${isoOffset(2)}" required><footer><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" type="submit">Guardar tarea</button></footer></form>`)}
function createTask(e){e.preventDefault();let d=new FormData(e.target);state.tasks.push({id:Date.now(),title:String(d.get('title')).trim(),course:Number(d.get('course')),weight:0,due:String(d.get('due')),type:'Recordatorio',status:'pendiente'});let ok=save();closeModal();render();notify(ok?'Tarea guardada. Podés actualizar para comprobarlo.':'Tarea agregada, pero tu navegador bloqueó el guardado. Descargá una copia.')}
function openSubmit(id){let t=state.tasks.find(x=>x.id===id);if(!t)return;const submitted=t.status==='entregada';showModal(`<div class="eyebrow">${escapeHTML(cn(t.course))}</div><h2>${submitted?'Comprobante de entrega':'Entregar actividad'}</h2><h3>${escapeHTML(t.title)}</h3><p class="small muted">Fecha límite: ${formatDate(t.due)} ${rel(t.due)<0?'· Fuera de plazo':''}</p>${submitted?`<div class="card soft"><span class="badge done">Entregada</span><p><strong>Tu entrega quedó registrada.</strong></p><p class="small">Código de demo: ${escapeHTML(t.receipt||'DEMO-'+t.id)}</p><p class="small">Contenido: ${escapeHTML(t.submission||'Entrega de demostración')}</p><p class="small">Fecha: ${escapeHTML(t.submittedAt||'—')}</p></div>`:`<p>Descripción: entregá tu trabajo de demostración con un enlace o una nota breve. Este prototipo no sube archivos a un servidor.</p><label class="field-label">Enlace o texto de entrega</label><textarea id="submission-text" class="field full" rows="4" placeholder="Ej. https://drive.google.com/... o 'Trabajo finalizado'"></textarea><p class="small muted">No incluyas datos personales ni trabajos reales. Es una entrega simulada.</p>`}<footer><button class="btn secondary" onclick="closeModal()">Cerrar</button>${submitted?`<button class="btn soft" onclick="undoSubmission(${id})">Volver a pendiente</button>`:`<button class="btn" onclick="submitTask(${id})">Confirmar entrega</button>`}</footer>`)}
function submitTask(id){let note=$('#submission-text')?.value.trim();if(!note){notify('Escribí una nota o enlace para confirmar la entrega.');return}let t=state.tasks.find(x=>x.id===id);t.status='entregada';t.submission=note;t.submittedAt=new Date().toLocaleString('es-GT');t.receipt='DEMO-'+id+'-'+Date.now().toString().slice(-5);let ok=save();closeModal();render();notify(ok?'Entrega simulada guardada con comprobante.':'Entrega registrada solo en esta sesión. Descargá una copia.');openSubmit(id)}
function undoSubmission(id){let t=state.tasks.find(x=>x.id===id);t.status='pendiente';delete t.receipt;delete t.submission;delete t.submittedAt;save();closeModal();render();notify('Tarea devuelta a pendiente.')}
function coursesPage(){let c= courses.find(x=>x.id===selectedCourse)||courses[0];return `${pageTitle('ACADÉMICO','Mis cursos','Encontrá materias, tareas y profesores en un solo lugar.')}<div class="course-grid">${courses.map(x=>`<button class="card course-card" style="text-align:left" onclick="selectCourse(${x.id})"><div class="course-mark">${escapeHTML(x.symbol)}</div><h3>${escapeHTML(x.name)}</h3><p class="small muted">${escapeHTML(x.code)} · Sección ${escapeHTML(x.section)} · ${x.credits} UMA</p><p class="small">${escapeHTML(x.teacher)}<br>Salón ${escapeHTML(x.room)}</p><span class="link-btn">Ver curso →</span></button>`).join('')}</div><div class="card" style="margin-top:18px"><div class="section-header"><h2>Detalle · ${escapeHTML(c.name)}</h2><span class="badge">${escapeHTML(c.code)}</span></div><p><strong>Profesor:</strong> ${escapeHTML(c.teacher)}<br><strong>Horario:</strong> ${escapeHTML(c.days.join(' y '))}, ${escapeHTML(c.time)}<br><strong>Salón:</strong> ${escapeHTML(c.room)}</p><h3>Actividades</h3>${state.tasks.filter(t=>t.course===c.id).map(taskHTML).join('')||'<div class="empty">Aún no hay tareas de este curso.</div>'}<button class="btn soft" onclick="nav('schedule')">Ver horario →</button></div>`}
function selectCourse(id){selectedCourse=id;render();setTimeout(()=>document.querySelector('#maincontent .card:last-child')?.scrollIntoView({behavior:'smooth',block:'nearest'}),0)}
function schedulePage(){let days=['Lunes','Martes','Miércoles','Jueves','Viernes'];return `${pageTitle('AGENDA','Agenda de clases','Tus materias distribuidas por día, con salones y profesores de ejemplo.')}<div class="card"><div class="schedule">${days.map(day=>`<div class="daycol"><h3>${day}</h3>${courses.filter(c=>c.days.includes(day)).sort((a,b)=>a.time.localeCompare(b.time)).map(c=>`<button class="session" onclick="showClass(${c.id})"><span class="small muted">${escapeHTML(c.time)}</span><strong>${escapeHTML(c.name)}</strong><span class="small">${escapeHTML(c.room)}<br>${escapeHTML(c.teacher)}</span></button>`).join('')||'<div class="small muted" style="padding:15px">Sin clases</div>'}</div>`).join('')}</div></div>`}
function showClass(id){let c=courses.find(c=>c.id===id);showModal(`<div class="eyebrow">Próxima clase · Datos ficticios</div><h2>${escapeHTML(c.name)}</h2><p><strong>Días:</strong> ${escapeHTML(c.days.join(', '))}</p><p><strong>Hora:</strong> ${escapeHTML(c.time)}</p><p><strong>Salón:</strong> ${escapeHTML(c.room)}</p><p><strong>Catedrático:</strong> ${escapeHTML(c.teacher)}</p><footer><button class="btn secondary" onclick="closeModal()">Cerrar</button><button class="btn" onclick="closeModal();selectedCourse=${id};nav('courses')">Abrir curso</button></footer>`)}
function announcementsPage(){let important=state.announcements.filter(a=>a.important),ordinary=state.announcements.filter(a=>!a.important);let card=a=>`<div class="alert-tile ${a.important?'alert-priority':''}"><div class="between"><span class="eyebrow">${a.important?'PRIORITARIO':'ACTUALIZACIÓN'} · ${escapeHTML(cn(a.course))}</span><span class="badge ${a.read?'done':'today'}">${a.read?'Leído':'Nuevo'}</span></div><h3>${escapeHTML(a.title)}</h3><p class="muted">${escapeHTML(a.body)}</p><div class="between"><small class="muted">${formatDate(a.date)}</small><button class="btn tiny ${a.important?'':'soft'}" onclick="showAnnouncement(${a.id})">${a.read?'Ver detalle':'Leer aviso →'}</button></div></div>`;return `${pageTitle('COMUNICACIÓN ACADÉMICA','Centro de avisos','Primero lo urgente. Después, el resto de novedades de tus cursos.')}<div class="alerts-summary"><div><span class="eyebrow">BANDEJA ACADÉMICA</span><h2>Enterate sin perder tiempo.</h2><p>Los avisos destacados aparecen primero para ayudarte a priorizar.</p></div><button class="btn secondary" onclick="markAllRead()">Marcar todo como leído</button></div><div class="alert-group"><div class="panel-heading"><h2>Prioritarios</h2><span class="badge late">${important.length} avisos</span></div><div class="alert-grid">${important.map(card).join('')||'<p>No hay avisos prioritarios.</p>'}</div></div><div class="alert-group"><div class="panel-heading"><h2>Otras novedades</h2><span class="badge">${ordinary.length} avisos</span></div><div class="alert-grid">${ordinary.map(card).join('')||'<p>No hay otras novedades.</p>'}</div></div>`}
function showAnnouncement(id){let a=state.announcements.find(x=>x.id===id);a.read=true;save();render();showModal(`<div class="eyebrow">${escapeHTML(cn(a.course))} · ${formatDate(a.date)}</div><h2>${escapeHTML(a.title)}</h2><p>${escapeHTML(a.body)}</p>${a.important?'<p class="small muted">Aviso importante · Confirmá que ya lo viste.</p>':''}<footer><button class="btn" onclick="closeModal();notify('Aviso leído.')">${a.important?'Confirmar que lo vi':'Cerrar'}</button></footer>`)}
function markAllRead(){state.announcements.forEach(a=>a.read=true);save();render();notify('Avisos marcados como leídos.')}
function calendarHTML(){let d=new Date(TODAY.getFullYear(),TODAY.getMonth()+calendarShift,1),year=d.getFullYear(),month=d.getMonth(),days=new Date(year,month+1,0).getDate(),first=(d.getDay()+6)%7;let html=`<div class="calendar-head"><button class="icon-btn" onclick="calMove(-1)" aria-label="Mes anterior">‹</button><strong>${d.toLocaleDateString('es-GT',{month:'long',year:'numeric'})}</strong><button class="icon-btn" onclick="calMove(1)" aria-label="Mes siguiente">›</button></div><div class="cal-grid">${['L','M','M','J','V','S','D'].map(x=>`<span class="calday heading">${x}</span>`).join('')}`;for(let i=0;i<first;i++)html+='<span></span>';for(let i=1;i<=days;i++){let date=year+'-'+String(month+1).padStart(2,'0')+'-'+String(i).padStart(2,'0'),marked=state.tasks.some(t=>t.due===date);html+=`<button class="calday ${marked?'marked':''} ${date===isoOffset(0)?'current':''}" onclick="calendarDay('${date}')" title="${marked?'Hay tareas':'Sin tareas'}">${i}</button>`}return html+'</div>'}
function calMove(n){calendarShift+=n;render()}function calendarDay(date){let ts=state.tasks.filter(t=>t.due===date);showModal(`<h2>${formatDate(date)}</h2>${ts.length?ts.map(t=>`<p>• ${escapeHTML(t.title)} <span class="small muted">(${escapeHTML(cn(t.course))})</span></p>`).join(''):'<p class="muted">No hay tareas registradas este día.</p>'}<footer><button class="btn secondary" onclick="closeModal()">Cerrar</button><button class="btn" onclick="closeModal();nav('tasks')">Ver tareas</button></footer>`)}

function groupsPage(){let gs=state.groups;return `<div class="module-banner"><span class="eyebrow">COLABORACIÓN ACADÉMICA</span><h1>Trabajos en grupo, sin perder el hilo.</h1><p>Repartí responsabilidades, revisá avances y mantené claro qué falta entregar. Datos de demostración guardados en este navegador.</p></div><div class="module-toolbar"><span class="muted">${gs.length} equipos · ${gs.reduce((n,g)=>n+g.steps.filter(s=>s.done).length,0)} actividades completadas</span><button class="btn" onclick="openGroupForm()">+ Crear trabajo grupal</button></div><div class="group-grid">${gs.map(g=>{let count=g.steps.filter(s=>s.done).length,pct=g.steps.length?Math.round(count/g.steps.length*100):0;return `<section class="group-card"><div class="group-card-top"><span class="eyebrow">${escapeHTML(cn(g.course))} · Entrega ${formatDate(g.due)}</span><h3>${escapeHTML(g.title)}</h3><div class="group-members">${g.members.map(m=>`<span class="member-chip">${escapeHTML(m)}</span>`).join('')}</div></div><div class="group-card-body"><div class="between"><strong>Avance del equipo</strong><span class="small muted">${count} / ${g.steps.length} completadas</span></div><div class="group-progress" aria-label="${pct}% de avance"><span style="width:${pct}%"></span></div>${g.steps.map((s,i)=>`<div class="group-step"><input id="g${g.id}_${i}" type="checkbox" ${s.done?'checked':''} onchange="toggleGroupStep(${g.id},${i},this.checked)"><label for="g${g.id}_${i}"><strong>${escapeHTML(s.title)}</strong><br><span class="small muted">Responsable: ${escapeHTML(s.owner)}</span></label></div>`).join('')||'<p class="muted">Agregá la primera responsabilidad del equipo.</p>'}<div class="between" style="margin-top:15px"><button class="btn soft tiny" onclick="addGroupStep(${g.id})">+ Agregar actividad</button><button class="link-btn" onclick="removeGroup(${g.id})">Eliminar equipo</button></div></div></section>`}).join('')}</div>`}
function toggleGroupStep(id,i,done){let g=state.groups.find(x=>x.id===id);if(!g||!g.steps[i])return;g.steps[i].done=done;save();render();notify(done?'Actividad completada.':'Actividad marcada como pendiente.')}
function openGroupForm(){showModal(`<div class="eyebrow">NUEVO TRABAJO EN EQUIPO</div><h2>Organizá un proyecto compartido</h2><label class="field-label">Nombre del trabajo</label><input class="field full" id="groupTitle" placeholder="Ej. Caso de conciliación bancaria" maxlength="90"><label class="field-label">Materia</label><select class="field full" id="groupCourse">${courses.map(c=>`<option value="${c.id}">${escapeHTML(c.name)}</option>`).join('')}</select><label class="field-label">Fecha de entrega</label><input class="field full" type="date" id="groupDue" value="${isoOffset(7)}"><label class="field-label">Integrantes (separados por comas)</label><input class="field full" id="groupMembers" value="Marbella García" maxlength="250"><footer><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="createGroup()">Crear equipo</button></footer>`)}
function createGroup(){let title=$('#groupTitle').value.trim(),course=Number($('#groupCourse').value),due=$('#groupDue').value,members=$('#groupMembers').value.split(',').map(x=>x.trim()).filter(Boolean);if(!title||!due||!members.length){notify('Completá nombre, fecha e integrantes.');return}state.groups.push({id:Date.now(),title,course,due,members,steps:[]});save();closeModal();render();notify('Trabajo grupal creado.')}
function addGroupStep(id){let g=state.groups.find(x=>x.id===id);if(!g)return;showModal(`<h2>Nueva responsabilidad</h2><p class="small muted">${escapeHTML(g.title)}</p><label class="field-label">Actividad</label><input class="field full" id="stepTitle" maxlength="100" placeholder="Ej. Revisar balance general"><label class="field-label">Responsable</label><select class="field full" id="stepOwner">${g.members.map(m=>`<option>${escapeHTML(m)}</option>`).join('')}</select><footer><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveGroupStep(${id})">Guardar actividad</button></footer>`)}
function saveGroupStep(id){let g=state.groups.find(x=>x.id===id),title=$('#stepTitle').value.trim(),owner=$('#stepOwner').value;if(!g||!title){notify('Escribí una actividad.');return}g.steps.push({title,owner,done:false});save();closeModal();render();notify('Actividad agregada.')}
function removeGroup(id){if(!confirm('¿Eliminar este trabajo grupal de la demo?'))return;state.groups=state.groups.filter(g=>g.id!==id);save();render();notify('Equipo eliminado.')}
function libraryPage(){let term=libraryQuery.trim().toLowerCase(),rs=state.resources.filter(r=>(libraryCourse==='all'||Number(libraryCourse)===Number(r.course))&&(!libraryFavorites||r.favorite)&&(!term||(r.title+' '+r.description+' '+cn(r.course)).toLowerCase().includes(term)));return `<div class="module-banner"><span class="eyebrow">RECURSOS PARA APRENDER</span><h1>Tu biblioteca, ordenada por materia.</h1><p>Guardá materiales de estudio, buscá apuntes y marcá tus favoritos. Abrí las fichas para leer sus contenidos de ejemplo.</p></div><div class="module-toolbar"><input class="field" id="librarySearch" placeholder="Buscar apuntes o guías..." aria-label="Buscar materiales" value="${escapeHTML(libraryQuery)}" oninput="setLibrarySearch(this.value)"><select class="field" aria-label="Filtrar materia" onchange="libraryCourse=this.value;render()"><option value="all">Todas las materias</option>${courses.map(c=>`<option value="${c.id}" ${String(libraryCourse)===String(c.id)?'selected':''}>${escapeHTML(c.name)}</option>`).join('')}</select><button class="btn ${libraryFavorites?'':'secondary'}" onclick="libraryFavorites=!libraryFavorites;render()">${libraryFavorites?'★ Solo favoritos':'☆ Ver favoritos'}</button><button class="btn" onclick="newResourceForm()">+ Nuevo material</button></div><div class="resource-grid">${rs.map(r=>`<div class="resource-card"><div class="between"><div class="resource-type">${r.type==='Guía'?'G':r.type==='Ejercicios'?'E':r.type==='Formulario'?'F':'A'}</div><button class="link-btn" aria-label="${r.favorite?'Quitar de':'Agregar a'} favoritos" onclick="toggleResourceFavorite(${r.id})">${r.favorite?'★ Favorito':'☆ Guardar'}</button></div><span class="eyebrow">${escapeHTML(cn(r.course))}</span><h3>${escapeHTML(r.title)}</h3><p class="small muted">${escapeHTML(r.description)}</p><div class="resource-actions"><span class="badge">${escapeHTML(r.type)}</span><button class="btn tiny soft" onclick="viewResource(${r.id})">Abrir material →</button></div></div>`).join('')||'<div class="empty">No hay materiales con esos filtros. Probá otra búsqueda.</div>'}</div><p class="small muted" style="margin-top:18px">Los recursos son ejemplos educativos, no archivos oficiales de la universidad. Los nuevos materiales se guardan en este navegador.</p>`}
function setLibrarySearch(s){libraryQuery=s;let pos=$('#librarySearch')?.selectionStart;render();let el=$('#librarySearch');if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
function toggleResourceFavorite(id){let r=state.resources.find(x=>x.id===id);if(!r)return;r.favorite=!r.favorite;save();render();notify(r.favorite?'Guardado en favoritos.':'Quitado de favoritos.')}
function viewResource(id){let r=state.resources.find(x=>x.id===id);if(!r)return;showModal(`<span class="eyebrow">${escapeHTML(cn(r.course))} · ${escapeHTML(r.type)}</span><h2>${escapeHTML(r.title)}</h2><p class="muted">${escapeHTML(r.description)}</p><div style="white-space:pre-line;background:#fff4f6;border-radius:12px;padding:18px;line-height:1.8">${escapeHTML(r.content)}</div><footer><button class="btn secondary" onclick="closeModal()">Cerrar</button><button class="btn" onclick="toggleResourceFavorite(${id});closeModal()">${r.favorite?'Quitar favorito':'Guardar favorito'}</button></footer>`)}
function newResourceForm(){showModal(`<span class="eyebrow">BIBLIOTECA PERSONAL</span><h2>Agregar un material de estudio</h2><label class="field-label">Título</label><input class="field full" id="resTitle" maxlength="90" placeholder="Ej. Resumen del parcial"><label class="field-label">Materia</label><select class="field full" id="resCourse">${courses.map(c=>`<option value="${c.id}">${escapeHTML(c.name)}</option>`).join('')}</select><label class="field-label">Tipo</label><select class="field full" id="resType"><option>Apuntes</option><option>Guía</option><option>Ejercicios</option><option>Formulario</option></select><label class="field-label">Descripción breve</label><input class="field full" id="resDesc" maxlength="160"><label class="field-label">Contenido o apuntes</label><textarea class="field full" id="resContent" rows="5" maxlength="4000" placeholder="Pegá aquí el contenido de tu material..."></textarea><p class="small muted">Esta versión guarda notas de texto; no sube documentos ni archivos a una nube.</p><footer><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveResource()">Guardar material</button></footer>`)}
function saveResource(){let title=$('#resTitle').value.trim(),content=$('#resContent').value.trim();if(!title||!content){notify('Escribí un título y contenido.');return}state.resources.push({id:Date.now(),title,course:Number($('#resCourse').value),type:$('#resType').value,description:$('#resDesc').value.trim()||'Material personal de estudio',content,favorite:false});save();closeModal();render();notify('Material guardado en tu biblioteca.')}

function gradesPage(){let scores=[88,79,91,84,95,83],avg=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);return `<div class="grade-hero"><div class="grade-ring"><div class="grade-ring-inner"><strong>${avg}</strong><small>de 100 · demo</small></div></div><div><span class="eyebrow" style="color:#ffccd4">REPORTE ACADÉMICO · SEMESTRE 2026-2</span><h1>Mis notas, a simple vista.</h1><p>Conocé tus resultados por materia y calculá qué necesitás para tu siguiente evaluación.</p><div class="grade-meta"><span>${courses.length} materias</span><span>Auditoría y Contaduría Pública</span><span>Calificaciones ficticias</span></div></div></div><div class="grade-layout"><section class="card"><div class="between"><h2>Rendimiento por materia</h2><span class="badge">Vista comparativa</span></div><p class="small muted">Valores de demostración. Cada barra representa la nota de ejemplo sobre 100.</p><div class="grade-course-list">${courses.map((c,i)=>`<div class="grade-course"><div class="grade-course-line"><div><strong>${escapeHTML(c.name)}</strong><div class="small muted">${escapeHTML(c.code)} · ${escapeHTML(c.teacher)}</div></div><strong>${scores[i]}/100</strong></div><div class="grade-track" role="img" aria-label="${scores[i]} de 100"><span style="width:${scores[i]}%"></span></div></div>`).join('')}</div></section><section class="grade-calc"><span class="eyebrow">HERRAMIENTA DE PLANIFICACIÓN</span><h2>¿Qué nota necesito en el final?</h2><p class="small muted">Usá la misma calculadora de antes, ahora integrada en tu reporte académico. El resultado es una simulación.</p><label class="field-label" for="currentGrade">Nota actual</label><input class="field" type="number" id="currentGrade" min="0" max="100" value="80"><label class="field-label" for="finalWeight">Valor del examen final (%)</label><input class="field" type="number" id="finalWeight" min="1" max="100" value="30"><label class="field-label" for="targetGrade">Nota que querés alcanzar</label><input class="field" type="number" id="targetGrade" min="0" max="100" value="85"><p><button class="btn" onclick="calcGrade()">Calcular mi nota →</button></p><div id="gradeResult" class="grade-result" aria-live="polite">Ingresá tus datos y presioná Calcular.</div></section></div>`}
function calcGrade(){let c=Number($('#currentGrade').value),w=Number($('#finalWeight').value),t=Number($('#targetGrade').value);if(![c,w,t].every(Number.isFinite)||c<0||c>100||w<=0||w>100||t<0||t>100){$('#gradeResult').textContent='Revisá los números ingresados.';return}let needed=(t-c*(1-w/100))/(w/100);$('#gradeResult').innerHTML=`<strong>Necesitás ${needed.toFixed(1)} / 100 en el final.</strong><p class="small muted">${needed>100?'Con estos valores la meta no se alcanza.':needed<0?'Ya superaste la meta indicada.':'Es una estimación basada en los datos que escribiste.'}</p>`}
function pensumPage(){return `${pageTitle('MI PROGRESO','Mi pensum','Una vista ilustrativa del avance en tu carrera de Auditoría y Contaduría Pública.')}<div class="card"><div class="between"><h2>Auditoría y Contaduría Pública · Plan 2026E</h2><span class="badge">Datos ficticios</span></div><p>Avance de ejemplo: 20% del pensum</p><div class="progress"><span style="width:20%"></span></div><div class="course-grid" style="margin-top:18px">${['Fundamentos','Formación contable','Especialización','Práctica profesional'].map((s,i)=>`<div class="card soft"><h3>${s}</h3><p class="small muted">${i===0?'Aprobado':i===1?'En curso':'Pendiente'}</p><span class="badge ${i===0?'future':i===1?'today':'done'}">${i===0?'Completado':i===1?'Actual':'Próximo'}</span></div>`).join('')}</div></div>`}
function assignPage(){return `${pageTitle('INSCRIPCIÓN','Asignación','Compará cursos y horarios en una demostración sin conexión a registros universitarios.')}<div class="card"><div class="table-wrap"><table><thead><tr><th>Curso</th><th>Catedrático</th><th>Horario</th><th>Sección</th><th>Acción</th></tr></thead><tbody>${courses.map(c=>`<tr><td>${escapeHTML(c.name)}</td><td>${escapeHTML(c.teacher)}</td><td>${escapeHTML(c.days.join('/'))} ${escapeHTML(c.time)}</td><td>${escapeHTML(c.section)}</td><td><button class="btn tiny soft" onclick="notify('Curso agregado a tu borrador de demostración (sin inscripción real).')">Añadir a borrador</button></td></tr>`).join('')}</tbody></table></div><p class="small muted">Las inscripciones y cupos son simulados; no se conecta al sistema oficial.</p></div>`}
function conferencePage(){return `${pageTitle('EVENTOS','Conferencias','Explorá actividades universitarias ficticias.')}<div class="card"><h2>Conferencia de ética y transparencia · Demo</h2><p class="muted">Una sesión de ejemplo para practicar registro y calendario.</p><button class="btn" onclick="notify('Inscripción simulada: no se envió ningún registro real.')">Registrarme (simulación)</button> <button class="btn secondary" onclick="downloadICS()">Añadir a calendario</button></div>`}
function downloadICS(){let date=isoOffset(7).replaceAll('-','');let s=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nBEGIN:VEVENT\r\nDTSTART:${date}T160000\r\nDTEND:${date}T170000\r\nSUMMARY:Conferencia de ética y transparencia (demo MiU)\r\nDESCRIPTION:Evento ficticio de demostración\r\nEND:VEVENT\r\nEND:VCALENDAR`;let u=URL.createObjectURL(new Blob([s],{type:'text/calendar'}));let a=document.createElement('a');a.href=u;a.download='conferencia-demo.ics';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function paymentsPage(){return `${pageTitle('SERVICIOS','Pagos','Información completamente ficticia; no se procesan pagos.')}<div class="cards"><div class="card"><div class="eyebrow">Saldo de ejemplo</div><div class="metric">Q 0.00</div></div><div class="card"><div class="eyebrow">Estado</div><div class="metric" style="font-size:20px">Al día</div></div></div><div class="card" style="margin-top:18px"><h2>Movimientos</h2><p class="muted">No hay movimientos reales disponibles en este prototipo.</p><button class="btn secondary" onclick="notify('Pago simulado. No se efectuó ningún cargo.')">Simular pago</button></div>`}
function parkingPage(){return `${pageTitle('SERVICIOS','Parqueo','Una experiencia de muestra, sin conexión con accesos al campus.')}<div class="card"><div class="eyebrow">Entradas disponibles (ejemplo)</div><div class="metric">12</div><p class="muted">Esta cifra es ficticia.</p><button class="btn" onclick="notify('Compra simulada. No hubo cobros ni cambios en accesos reales.')">Simular compra de entradas</button></div>`}
function teachersPage(){return `${pageTitle('COMUNIDAD','Catedráticos','Información ficticia para explorar perfiles de ejemplo.')}<div class="course-grid">${[...new Set(courses.map(c=>c.teacher))].map((n,i)=>`<div class="card"><div class="course-mark">${escapeHTML(n.split(' ').map(x=>x[0]).join(''))}</div><h3>${escapeHTML(n)}</h3><p class="muted">Perfil de ejemplo · Área académica</p><button class="btn soft" onclick="notify('Las reseñas reales no están disponibles en este prototipo.')">Ver perfil</button></div>`).join('')}</div>`}
function adminPage(){return `${pageTitle('ADMINISTRACIÓN','Usuarios y roles','Vista ilustrativa, sin permisos administrativos reales.')}<div class="card"><h2>Usuarios de demostración</h2><div class="table-wrap"><table><tr><th>Nombre</th><th>Rol</th><th>Tipo</th></tr><tr><td>${escapeHTML(state.name)}</td><td>${escapeHTML(state.role)}</td><td>Simulación local</td></tr></table></div><p class="small muted">Cambiar el selector de rol solo modifica la interfaz. En una aplicación real deben implementarse autenticación y reglas RLS.</p></div>`}
function showGuide(){showModal(`<div class="eyebrow">GUÍA DE PRIMER INGRESO</div><h2>Tu MiU, paso a paso</h2><p><strong>1.</strong> Entrá a <b>Plan de entregas</b> y consultá una tarea.</p><p><strong>2.</strong> Tocá <b>Entregar</b>, escribí una nota o enlace y confirmá para obtener un comprobante.</p><p><strong>3.</strong> Entrá a <b>Agenda de clases</b> y abrí una clase para consultar el aula y el profesor.</p><p><strong>4.</strong> Entrá a <b>Centro de avisos</b> y leé el anuncio más reciente.</p><p><strong>5.</strong> Usá <b>Descargar copia de tareas</b> para guardar tu información de ejemplo.</p><p class="small muted">Todo funciona con datos ficticios locales. Google Login, roles seguros y una base de datos compartida todavía no están conectados.</p><footer><button class="btn" onclick="closeModal();dismissGuide()">¡Entendido!</button></footer>`)}
function showModal(inner){modal=inner;$('#overlay').innerHTML=`<div class="modalwrap" role="presentation" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="Detalle de MiU"><header><span class="eyebrow">MIU · DEMOSTRACIÓN</span><button class="x" aria-label="Cerrar" onclick="closeModal()">×</button></header><div style="margin-top:15px">${inner}</div></section></div>`;let input=$('#overlay input');if(input)input.focus()}
function closeModal(){modal=null;$('#overlay').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});

async function signInGoogle(){
 if(!googleConfigured()){notify('Primero configurá la clave sb_publishable_ en index.html en GitHub.');return;}
 if(!supaClient){notify('No se pudo cargar Supabase. Revisá la conexión a Internet.');return;}
 try {
  const {error}=await supaClient.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin+'/',scopes:'openid email profile'}});
  if(error)notify('Google Login: '+error.message);
 }catch(e){notify('Error al conectar con Google. Revisá la configuración de Supabase.');}
}
function setGoogleSession(session){
 googleSession=session;
 if(!session?.user)return;
 const u=session.user;
 state.logged=true;
 state.authMode='google';
 state.role='estudiante'; // los otros roles son demostrativos, NO permisos de seguridad
 state.name=u.user_metadata?.full_name||u.user_metadata?.name||u.email?.split('@')[0]||'Estudiante';
 save();render();
}
async function initializeGoogleAuth(){
 if(!googleConfigured())return;
 if(!window.supabase?.createClient){notify('No se cargó la librería de Supabase.');return;}
 try{
  supaClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{flowType:'pkce',detectSessionInUrl:false,persistSession:true,autoRefreshToken:true}});
  const params=new URLSearchParams(window.location.search);
  const code=params.get('code');
  if(params.has('error')){
   notify('No se completó Google Login: '+(params.get('error_description')||params.get('error')));
   history.replaceState({},document.title,window.location.pathname);
  } else if(code){
   const {data,error}=await supaClient.auth.exchangeCodeForSession(code);
   history.replaceState({},document.title,window.location.pathname);
   if(error)notify('Error al completar Google Login: '+error.message);
   else if(data?.session)setGoogleSession(data.session);
  }
  const {data:{session},error}=await supaClient.auth.getSession();
  if(!error && session)setGoogleSession(session);
  else if(state.authMode==='google') {state.logged=false;state.authMode='demo';save();render();}
  supaClient.auth.onAuthStateChange((event,session)=>{
    if(event==='SIGNED_IN' && session && (!googleSession || googleSession.user.id!==session.user.id))setGoogleSession(session);
    if(event==='SIGNED_OUT' && state.authMode==='google'){
      state.logged=false;state.authMode='demo';googleSession=null;save();render();
    }
  });
 }catch(e){notify('No se pudo inicializar Google Login: '+(e?.message||'error de conexión'));}
}
render();
initializeGoogleAuth();
</script>
